name: Anime and Movies Crossword CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Puzzle Assets Integrity
        run: dart tools/verify_all_puzzles.dart

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test --coverage

      - name: Build Android Release AAB (Google Play Store)
        run: flutter build appbundle --release --no-pub

      - name: Build Android Release APK (Direct Phone Install)
        run: flutter build apk --release --no-pub

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-and-movies-crossword-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-and-movies-crossword-aab
          path: build/app/outputs/bundle/release/app-release.aab
