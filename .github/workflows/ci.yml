name: CineCross CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Puzzle Assets Integrity
        run: dart tools/verify_all_puzzles.dart

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test --coverage

      - name: Build Android Release AAB (Unsigned CI check)
        run: flutter build appbundle --release --no-pub
