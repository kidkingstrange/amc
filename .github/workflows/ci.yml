name: Anime and Movies Crossword CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Dependencies
        run: flutter pub get

      - name: Verify Puzzle Assets Integrity
        run: dart tools/verify_all_puzzles.dart

      - name: Run Static Analysis
        run: flutter analyze

      - name: Run Test Suite
        run: flutter test --coverage

      - name: Configure Keystore for Release Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Configuring release keystore from GitHub Secrets..."
            echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
            printf "storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=upload-keystore.jks\n" \
              "$KEYSTORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > android/key.properties
            echo "Release key.properties generated successfully."
          else
            echo "Warning: KEYSTORE_BASE64 secret not found, building with default config."
          fi

      - name: Build Android Release AAB (Google Play Store)
        run: flutter build appbundle --release --no-pub

      - name: Build Android Release APK (Direct Phone Install)
        run: flutter build apk --release --no-pub

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-and-movies-crossword-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Google Play AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-and-movies-crossword-aab
          path: build/app/outputs/bundle/release/app-release.aab
